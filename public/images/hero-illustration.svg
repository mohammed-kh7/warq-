<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="100%" stop-color="#F5E6CC"/>
    </linearGradient>
    <linearGradient id="pageGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F0E0C0"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A038"/>
      <stop offset="100%" stop-color="#D4891C"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4891C"/>
      <stop offset="100%" stop-color="#B87414"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#B87414" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ambient glow behind book -->
  <ellipse cx="300" cy="360" rx="240" ry="200" fill="#E8A038" opacity="0.08" filter="url(#glow)"/>

  <!-- Left book cover -->
  <path d="M70 280 L290 240 L290 560 L70 580 Z" fill="url(#coverGrad)" filter="url(#softShadow)" opacity="0.9"/>

  <!-- Right book cover -->
  <path d="M530 280 L310 240 L310 560 L530 580 Z" fill="url(#coverGrad)" filter="url(#softShadow)" opacity="0.9"/>

  <!-- Left pages -->
  <path d="M85 290 L275 255 L275 545 L85 565 Z" fill="url(#pageGrad2)" opacity="0.95"/>
  <!-- Right pages -->
  <path d="M515 290 L325 255 L325 545 L515 565 Z" fill="url(#pageGrad)" opacity="0.95"/>

  <!-- Spine -->
  <path d="M290 240 L310 250 L310 550 L290 560 Z" fill="url(#spineGrad)" opacity="0.85"/>

  <!-- Page lines left -->
  <line x1="110" y1="320" x2="255" y2="295" stroke="#C4A87A" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="105" y1="350" x2="255" y2="322" stroke="#C4A87A" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <line x1="100" y1="380" x2="255" y2="350" stroke="#C4A87A" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <line x1="105" y1="410" x2="255" y2="380" stroke="#C4A87A" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="115" y1="440" x2="255" y2="412" stroke="#C4A87A" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="130" y1="470" x2="255" y2="445" stroke="#C4A87A" stroke-width="2" opacity="0.25" stroke-linecap="round"/>

  <!-- Page lines right -->
  <line x1="345" y1="295" x2="490" y2="320" stroke="#C4A87A" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="345" y1="322" x2="495" y2="350" stroke="#C4A87A" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <line x1="345" y1="350" x2="500" y2="380" stroke="#C4A87A" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <line x1="345" y1="380" x2="495" y2="410" stroke="#C4A87A" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="345" y1="412" x2="490" y2="440" stroke="#C4A87A" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="345" y1="445" x2="480" y2="470" stroke="#C4A87A" stroke-width="2" opacity="0.25" stroke-linecap="round"/>

  <!-- Floating icons rising from the book -->

  <!-- Lightbulb (knowledge) -->
  <g transform="translate(140, 160) scale(0.85)" filter="url(#softShadow)">
    <circle cx="40" cy="28" r="22" fill="#FFE066" opacity="0.9"/>
    <circle cx="40" cy="28" r="14" fill="#FFF5CC" opacity="0.6"/>
    <rect x="33" y="48" width="14" height="8" rx="2" fill="#B87414" opacity="0.7"/>
    <rect x="35" y="56" width="10" height="6" rx="2" fill="#B87414" opacity="0.5"/>
    <path d="M28 16 L32 8 L36 16" stroke="#E8A038" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M48 16 L44 8 L40 16" stroke="#E8A038" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M40 4 L40 0" stroke="#E8A038" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Heart (community love) -->
  <g transform="translate(240, 100) scale(0.75)" filter="url(#softShadow)">
    <path d="M30 52 C30 52 8 36 8 22 C8 12 16 6 24 6 C28 6 30 9 30 12 C30 9 32 6 36 6 C44 6 52 12 52 22 C52 36 30 52 30 52Z" fill="#E05A47" opacity="0.85"/>
  </g>

  <!-- Globe (shared knowledge) -->
  <g transform="translate(350, 130) scale(0.75)" filter="url(#softShadow)">
    <circle cx="30" cy="30" r="24" fill="#2B7A78" opacity="0.8"/>
    <circle cx="30" cy="30" r="24" fill="#3A9E9C" opacity="0.3"/>
    <path d="M6 30 Q30 14 54 30" stroke="#FFFBF5" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M6 30 Q30 46 54 30" stroke="#FFFBF5" stroke-width="1.5" fill="none" opacity="0.5"/>
    <ellipse cx="30" cy="30" rx="10" ry="24" stroke="#FFFBF5" stroke-width="1.5" fill="none" opacity="0.4"/>
    <line x1="30" y1="6" x2="30" y2="54" stroke="#FFFBF5" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Plant (growth) -->
  <g transform="translate(440, 175) scale(0.8)" filter="url(#softShadow)">
    <path d="M25 56 L25 28" stroke="#4a8f72" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 28 C12 18 12 8 20 4 C28 8 28 18 25 28" fill="#5aad7a" opacity="0.8"/>
    <path d="M25 28 C38 18 38 8 30 4 C22 8 22 18 25 28" fill="#4a8f72" opacity="0.7"/>
    <path d="M25 40 C15 34 15 26 21 22 C29 26 29 34 25 40" fill="#5aad7a" opacity="0.6"/>
    <path d="M25 40 C35 34 35 26 29 22 C21 26 21 34 25 40" fill="#4a8f72" opacity="0.5"/>
    <rect x="16" y="52" width="18" height="10" rx="3" fill="#B87414" opacity="0.7"/>
  </g>

  <!-- Decorative dots rising -->
  <circle cx="190" cy="80" r="4" fill="#E8A038" opacity="0.35"/>
  <circle cx="280" cy="55" r="3" fill="#E05A47" opacity="0.3"/>
  <circle cx="400" cy="70" r="5" fill="#2B7A78" opacity="0.3"/>
  <circle cx="480" cy="110" r="3.5" fill="#E8A038" opacity="0.25"/>
  <circle cx="100" cy="120" r="3" fill="#5aad7a" opacity="0.3"/>
  <circle cx="200" cy="40" r="2" fill="#D4891C" opacity="0.35"/>
  <circle cx="370" cy="45" r="2.5" fill="#C0392B" opacity="0.25"/>
  <circle cx="510" cy="80" r="2" fill="#E8A038" opacity="0.2"/>

  <!-- Small decorative stars -->
  <path d="M170 100 L172 106 L178 106 L173 110 L175 116 L170 112 L165 116 L167 110 L162 106 L168 106Z" fill="#E8A038" opacity="0.3"/>
  <path d="M460 70 L461.5 74 L466 74 L462.5 77 L464 81 L460 78 L456 81 L457.5 77 L454 74 L458.5 74Z" fill="#E8A038" opacity="0.25"/>
</svg>
